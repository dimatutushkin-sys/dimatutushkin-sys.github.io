<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Резюме | Дмитрий</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            padding: 25px;
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 40px rgba(0,0,0,0.25);
        }
        img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4CAF50;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        img:hover {
            border-color: #ff9800;
            transform: scale(1.02);
        }
        h1 {
            font-size: 2rem;
            color: #1e2a3a;
            text-shadow: 1px 1px 0 #ccc;
            margin: 5px 0;
        }
        .surname {
            font-size: 1.5rem;
            font-weight: 500;
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            display: inline-block;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .desc {
            font-size: 0.95rem;
            color: #555;
            margin: 10px 0;
        }
        input, button {
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 40px;
            border: none;
            outline: none;
        }
        input {
            border: 2px solid #ddd;
            text-align: center;
            flex: 1;
        }
        input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76,175,80,0.3);
        }
        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #45a049;
            transform: scale(1.02);
        }
        .btn-random {
            background: #ff9800;
        }
        .btn-random:hover {
            background: #fb8c00;
        }
        .group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 10px;
        }
        .extra {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
<div class="card">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Фото">
    <h1>Дмитрий</h1>
    <div class="surname" id="surnameDisplay">Смирнов</div>
    <div class="desc">Веб-разработчик | JS, CSS, HTML</div>

    <div class="group">
        <input type="text" id="newSurname" placeholder="Новая фамилия" value="Иванов">
        <button id="changeSurnameBtn">Изменить фамилию</button>
    </div>
    <div class="group">
        <button id="randomBgBtn" class="btn-random">🎲 Случайный фон</button>
    </div>
    <div class="extra">
        📌 Измени фамилию через поле ввода<br>
        🎨 Кнопка меняет цвет фона страницы
    </div>
</div>

<script>
    const surnameEl = document.getElementById('surnameDisplay');
    const surnameInput = document.getElementById('newSurname');
    const changeBtn = document.getElementById('changeSurnameBtn');
    const randomBtn = document.getElementById('randomBgBtn');

    changeBtn.onclick = () => {
        let val = surnameInput.value.trim();
        if (val) surnameEl.textContent = val;
        else alert("Введите фамилию!");
    };

    randomBtn.onclick = () => {
        const hue = Math.floor(Math.random() * 360);
        document.body.style.backgroundColor = `hsl(${hue}, 70%, 85%)`;
    };
</script>
</body>
</html>
